<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>퀴즈 테스트</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 2rem; }
  #summary { font-size: 1.3rem; }
  #summary.green { color: #0a7d2b; }
  #summary.red { color: #c0271a; }
  ul { list-style: none; padding: 0; }
  li { padding: 2px 0; font-family: ui-monospace, monospace; font-size: 13px; }
  li.fail { color: #c0271a; }
</style>
</head>
<body>

<h1 id="summary">실행 중…</h1>
<ul id="results"></ul>

<!-- #quiz-root 를 두지 않는다. script.js 는 그것이 있을 때만 초기화한다. -->
<script src="questions.js"></script>
<script src="script.js"></script>

<script>
// ── 러너 ────────────────────────────────────────────────
let 통과 = 0, 실패 = 0;

function test(name, fn) {
  try {
    fn();
    통과++;
    기록("✓ " + name, "pass");
  } catch (e) {
    실패++;
    기록("✗ " + name + " — " + e.message, "fail");
  }
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg ? msg + ": " : "") +
      `기대 ${JSON.stringify(expected)}, 실제 ${JSON.stringify(actual)}`);
  }
}

function assertDeepEqual(actual, expected, msg) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error((msg ? msg + ": " : "") + `기대 ${b}, 실제 ${a}`);
  }
}

function 기록(text, cls) {
  const li = document.createElement("li");
  li.textContent = text;
  li.className = cls;
  document.getElementById("results").appendChild(li);
}

// ── 공통 조각 ───────────────────────────────────────────
function 정상문항(덮어쓰기) {
  return Object.assign({
    q: "질문입니다", choices: ["가", "나", "다", "라"], answer: 0,
    explanation: "해설입니다", source: "출처입니다",
  }, 덮어쓰기 || {});
}

function 집합(items) {
  return {
    korean_history:  { name: "한국사",      items: items.slice() },
    world_geography: { name: "세계지리",    items: items.slice() },
    science:         { name: "과학",        items: items.slice() },
    arts_culture:    { name: "예술과 문화", items: items.slice() },
  };
}

function 문제있음(questions) {
  return validateQuestions(questions, false).length > 0;
}

// ── Task 1.1: 문항 검사 ─────────────────────────────────
test("정상 데이터는 문제가 없다", () => {
  assertDeepEqual(validateQuestions(QUESTIONS, false), []);
});

test("카테고리 키가 다르면 잡아낸다", () => {
  assertEqual(validateQuestions({ wrong_key: { name: "x", items: [] } }, false).length > 0, true);
});

test("보기가 4개가 아니면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ choices: ["가", "나", "다"] })])), true);
});

test("보기에 중복이 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ choices: ["가", "가", "다", "라"] })])), true);
});

test("보기가 비어 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ choices: ["가", "", "다", "라"] })])), true);
});

test("answer 가 범위를 벗어나면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ answer: 4 })])), true);
});

test("질문이 비어 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ q: "" })])), true);
});

test("해설이 비어 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ explanation: "" })])), true);
});

test("출처가 비어 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ source: "" })])), true);
});

test("해설에 보기 번호가 있으면 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ explanation: "1번이 정답이다" })])), true);
});

test("해설에 원문자 보기 번호가 있어도 잡아낸다", () => {
  assertEqual(문제있음(집합([정상문항({ explanation: "②가 정답이다" })])), true);
});

test("정상 문항만 있으면 통과한다", () => {
  assertDeepEqual(validateQuestions(집합([정상문항()]), false), []);
});

test("requireTen 이 true 면 10개가 아닌 카테고리를 잡아낸다", () => {
  assertEqual(validateQuestions(QUESTIONS, true).length > 0, true);
});

// ── Task 1.2: 섞기와 라운드 ─────────────────────────────
test("shuffle 은 원본을 바꾸지 않는다", () => {
  const src = [1, 2, 3, 4];
  shuffle(src, () => 0.5);
  assertDeepEqual(src, [1, 2, 3, 4]);
});

test("shuffle 은 원소를 잃지 않는다", () => {
  assertDeepEqual(shuffle([1, 2, 3, 4], () => 0.5).sort(), [1, 2, 3, 4]);
});

test("buildRound 는 문항을 잃지 않는다", () => {
  assertEqual(buildRound("science", QUESTIONS, Math.random).items.length,
              QUESTIONS.science.items.length);
});

test("buildRound 는 카테고리 이름을 함께 싣는다", () => {
  const round = buildRound("korean_history", QUESTIONS, Math.random);
  assertEqual(round.category, "korean_history");
  assertEqual(round.name, "한국사");
});

test("보기를 섞어도 answer 가 같은 보기를 가리킨다", () => {
  const round = buildRound("korean_history", QUESTIONS, () => 0.5);
  assertEqual(round.items.length > 0, true, "씨드 문항이 있어야 의미가 있는 검사다");
  round.items.forEach((item) => {
    const 원본 = QUESTIONS.korean_history.items.find((o) => o.q === item.q);
    assertEqual(item.choices[item.answer], 원본.choices[원본.answer]);
  });
});

test("보기를 섞어도 보기 집합은 그대로다", () => {
  const round = buildRound("arts_culture", QUESTIONS, () => 0.5);
  round.items.forEach((item) => {
    const 원본 = QUESTIONS.arts_culture.items.find((o) => o.q === item.q);
    assertDeepEqual(item.choices.slice().sort(), 원본.choices.slice().sort());
  });
});

test("buildRound 는 원본 문항을 건드리지 않는다", () => {
  const 전 = JSON.stringify(QUESTIONS.world_geography.items);
  buildRound("world_geography", QUESTIONS, () => 0.5);
  assertEqual(JSON.stringify(QUESTIONS.world_geography.items), 전);
});

// ── Task 1.3: 채점 ──────────────────────────────────────
test("힌트 없이 맞히면 1점",   () => assertEqual(scoreAnswer(true,  false), 1));
test("힌트 쓰고 맞히면 0.5점", () => assertEqual(scoreAnswer(true,  true),  0.5));
test("힌트 없이 틀리면 0점",   () => assertEqual(scoreAnswer(false, false), 0));
test("힌트 쓰고 틀려도 0점",   () => assertEqual(scoreAnswer(false, true),  0));

// ── Task 1.4: 연습 모드 한 판 ───────────────────────────
// DOM 이 없는 문서라 render() 는 그냥 돌아 나간다. 상태만 검사한다.

test("해설이 뜬 뒤 다시 고르면 점수가 두 번 더해지지 않는다", () => {
  startRound("korean_history", "practice");
  const 정답 = state.round.items[0].answer;
  selectChoice(정답);
  selectChoice(정답);
  assertEqual(state.score, 1);
});

test("문항이 10개가 아니어도 만점이 문항 수를 따른다", () => {
  startRound("korean_history", "practice");
  assertEqual(state.round.items.length, QUESTIONS.korean_history.items.length);
});

test("틀리면 점수가 오르지 않고 틀린 문항으로 쌓인다", () => {
  startRound("science", "practice");
  const 문항 = state.round.items[0];
  selectChoice((문항.answer + 1) % 4);
  assertEqual(state.score, 0);
  assertEqual(state.wrong.length, 1);
  assertEqual(state.wrong[0].q, 문항.q);
});

test("답을 고르기 전에는 해설이 뜨지 않는다", () => {
  startRound("science", "practice");
  assertEqual(state.answered, false);
});

test("마지막 문항을 넘기면 라운드가 끝난다", () => {
  startRound("arts_culture", "practice");
  while (!state.finished) {
    selectChoice(state.round.items[state.index].answer);
    nextQuestion();
  }
  assertEqual(state.finished, true);
  assertEqual(state.score, QUESTIONS.arts_culture.items.length);
});

test("해설 전에는 다음으로 넘어가지 않는다", () => {
  startRound("world_geography", "practice");
  nextQuestion();
  assertEqual(state.index, 0);
});

// ── Task 2.1: 모드 ──────────────────────────────────────
test("연습 모드는 순위표에 기록하지 않는다", () => {
  assertEqual(recordsToLeaderboard("practice"), false);
});
test("스피드 모드는 순위표에 기록한다", () => {
  assertEqual(recordsToLeaderboard("speed"), true);
});
test("힌트 모드는 순위표에 기록한다", () => {
  assertEqual(recordsToLeaderboard("hint"), true);
});

// ── 요약 ────────────────────────────────────────────────
const s = document.getElementById("summary");
s.textContent = `통과 ${통과} / 실패 ${실패}`;
s.className = 실패 === 0 ? "green" : "red";
</script>

</body>
</html>
